<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Personal Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 10%, var(--primary-light), var(--bg-main) 60%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-xl);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .demo-credentials-box {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--bg-card-subtle);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
    }
  </style>
</head>
<body class="auth-page">

  <!-- Top bar with brand & theme toggle -->
  <div style="width:100%; max-width:440px; display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
    <a href="index.html" style="display:flex; align-items:center; gap:0.5rem; font-weight:700; color:var(--text-main);">
      <div class="brand-icon" style="width:30px; height:30px; font-size:0.9rem;">₹</div>
      <span>ExpenseTracker</span>
    </a>
    <button id="themeToggleBtn" class="btn-icon" title="Toggle Theme" aria-label="Toggle Theme">🌙</button>
  </div>

  <!-- Login Card (Matches Figure 2: 3. Login Page Wireframe) -->
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="text-2xl font-bold" style="margin-bottom:0.35rem;">Welcome Back</h1>
      <p class="text-muted text-sm">Log in to manage your income & expenses</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group" id="emailGroup">
        <label for="loginEmail" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="loginEmail" 
          class="form-control" 
          placeholder="name@example.com" 
          value="user@gmail.com"
          required
        >
        <span class="form-error" id="emailError">Please enter a valid email address</span>
      </div>

      <div class="form-group" id="passwordGroup">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label for="loginPassword" class="form-label">Password</label>
          <a href="#" onclick="alert('Demo reset instructions sent! Password is password123'); return false;" class="text-xs text-primary" style="font-weight:600;">Forgot Password?</a>
        </div>
        <input 
          type="password" 
          id="loginPassword" 
          class="form-control" 
          placeholder="••••••••" 
          value="password123"
          required
        >
        <span class="form-error" id="passwordError">Password must be at least 6 characters</span>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem;">
        <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.875rem; color:var(--text-muted); cursor:pointer;">
          <input type="checkbox" id="rememberMe" checked style="accent-color:var(--primary);">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:0.8rem;">
        <span>Login</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </button>
    </form>

    <div style="text-align:center; margin-top:1.5rem; font-size:0.875rem; color:var(--text-muted);">
      Don't have an account? 
      <a href="register.html" class="text-primary font-semibold" style="text-decoration:underline;">Register</a>
    </div>

    <!-- Quick Demo Accounts for Project Reviewers -->
    <div class="demo-credentials-box">
      <div style="font-weight:700; margin-bottom:0.5rem; color:var(--text-main);">⚡ Quick Fill Demo Logins:</div>
      <div style="display:flex; gap:0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm" id="btnFillUser" style="flex:1;">
          👤 Student / User
        </button>
        <button type="button" class="btn btn-secondary btn-sm" id="btnFillAdmin" style="flex:1;">
          🛡️ Admin
        </button>
      </div>
    </div>
  </div>

  <div style="margin-top:2rem; font-size:0.8rem; color:var(--text-muted); text-align:center;">
    Bahria University Karachi Campus &bull; Web App Development Assignment 2
  </div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Autofill helpers
    document.getElementById('btnFillUser').addEventListener('click', () => {
      document.getElementById('loginEmail').value = 'user@gmail.com';
      document.getElementById('loginPassword').value = 'password123';
      showToast('Loaded demo Student/User credentials', 'info');
    });

    document.getElementById('btnFillAdmin').addEventListener('click', () => {
      document.getElementById('loginEmail').value = 'admin@expensetracker.com';
      document.getElementById('loginPassword').value = 'adminpassword';
      showToast('Loaded demo Admin credentials', 'info');
    });

    // Form Validation & Submission
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let isValid = true;

      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');
      const emailGroup = document.getElementById('emailGroup');
      const passwordGroup = document.getElementById('passwordGroup');

      const emailVal = emailInput.value.trim();
      const passVal = passwordInput.value.trim();

      // Email validation regex
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(emailVal)) {
        emailGroup.classList.add('has-error');
        isValid = false;
      } else {
        emailGroup.classList.remove('has-error');
      }

      // Password validation
      if (passVal.length < 6) {
        passwordGroup.classList.add('has-error');
        isValid = false;
      } else {
        passwordGroup.classList.remove('has-error');
      }

      if (!isValid) return;

      // Verify with mock database
      const users = window.store.getUsers();
      const matched = users.find(u => u.email.toLowerCase() === emailVal.toLowerCase() && u.password === passVal);

      if (matched) {
        window.store.setCurrentUser(matched);
        showToast(`Welcome back, ${matched.name}!`, 'success');
        setTimeout(() => {
          if (matched.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 600);
      } else {
        showToast('Invalid email or password. Please check your credentials.', 'error');
      }
    });
  </script>
</body>
</html>
